name: Telegram Reminders Cron

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Bienestar CRM Reminders
        run: |
          curl -s -f "https://bienestar-crm.vercel.app/api/telegram?action=reminders" || echo "Reminder check finished."
